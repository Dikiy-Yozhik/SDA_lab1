name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "CI is running"
          echo "Repository check passed"

      - name: Prepare repository for secret scan
        run: |
          rm -rf /tmp/repo-scan
          mkdir -p /tmp/repo-scan
          git archive HEAD | tar -x -C /tmp/repo-scan

      - name: TruffleHog secret scan
        run: |
          docker run --rm \
            -v /tmp/repo-scan:/scan \
            ghcr.io/trufflesecurity/trufflehog:latest \
            filesystem /scan \
            --fail \
            --results=verified,unverified,unknown
